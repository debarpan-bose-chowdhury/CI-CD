name: Reusable Version Bump

on:
  workflow_call:
    inputs:
      language:
        type: string
        default: auto
      version-file-dotnet:
        type: string
        default: Directory.Build.props
      version-file-python:
        type: string
        default: pyproject.toml
      base-branch:
        type: string
        default: main
    secrets:
      GH_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Setup git
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Detect language and version files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          language='${{ inputs.language }}'
          version_file_dotnet='${{ inputs.version-file-dotnet }}'
          version_file_python='${{ inputs.version-file-python }}'

          detected_language=''
          version_file=''

          # Auto-detect if not specified
          if [ "$language" = 'auto' ] || [ -z "$language" ]; then
            if [ -f "$version_file_dotnet" ]; then
              detected_language='dotnet'
              version_file="$version_file_dotnet"
            elif [ -f "$version_file_python" ]; then
              detected_language='python'
              version_file="$version_file_python"
            fi
          elif [ "$language" = 'dotnet' ]; then
            detected_language='dotnet'
            version_file="$version_file_dotnet"
          elif [ "$language" = 'python' ]; then
            detected_language='python'
            version_file="$version_file_python"
          fi

          if [ -z "$detected_language" ]; then
            echo "ERROR: Unable to detect language or version file" >&2
            exit 1
          fi

          echo "language=$detected_language" >> "$GITHUB_OUTPUT"
          echo "version-file=$version_file" >> "$GITHUB_OUTPUT"

      - name: Get current version and analyze commits
        id: version-calc
        shell: bash
        run: |
          set -euo pipefail

          language='${{ steps.detect.outputs.language }}'
          version_file='${{ steps.detect.outputs.version-file }}'

          # Extract current version
          current_version=''
          if [ "$language" = 'dotnet' ]; then
            # Parse Directory.Build.props for <Version>X.Y.Z</Version>
            current_version=$(grep -oP '<Version>\K[^<]+' "$version_file" || echo '0.0.0')
          elif [ "$language" = 'python' ]; then
            # Parse pyproject.toml or setup.py for version
            if [ -f "$version_file" ]; then
              current_version=$(grep -oP 'version\s*=\s*["\047]\K[^"\047]+' "$version_file" | head -1 || echo '0.0.0')
            fi
          fi

          echo "Current version: $current_version"

          # Use the HEAD commit message for the push to the base branch.
          merge_commit='HEAD'

          # Get commit message
          commit_msg=$(git log -1 --pretty=format:%b "$merge_commit")
          commit_subject=$(git log -1 --pretty=format:%s "$merge_commit")
          commit_full="${commit_subject}

          ${commit_msg}"

          echo "Commit message:"
          echo "$commit_full" | head -20

          # Analyze commit for Conventional Commits
          is_breaking=0
          bump_type='patch'

          if echo "$commit_full" | grep -qi 'BREAKING CHANGE:'; then
            is_breaking=1
            bump_type='major'
          elif echo "$commit_full" | grep -qE '^feat(\(.*\))?!:'; then
            is_breaking=1
            bump_type='major'
          elif echo "$commit_full" | grep -qE '^feat(\(.*\))?:'; then
            bump_type='minor'
          elif echo "$commit_full" | grep -qE '^fix(\(.*\))?:'; then
            bump_type='patch'
          else
            # Default to patch if no conventional commit markers
            bump_type='patch'
          fi

          echo "Detected bump type: $bump_type (breaking: $is_breaking)"

          # Parse semantic version
          IFS='.' read -r major minor patch <<< "$current_version"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          # Calculate new version
          if [ "$bump_type" = 'major' ]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [ "$bump_type" = 'minor' ]; then
            minor=$((minor + 1))
            patch=0
          elif [ "$bump_type" = 'patch' ]; then
            patch=$((patch + 1))
          fi

          new_version="${major}.${minor}.${patch}"
          echo "New version: $new_version"

          echo "new-version=$new_version" >> "$GITHUB_OUTPUT"
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"
          echo "bump-type=$bump_type" >> "$GITHUB_OUTPUT"

      - name: Update version file
        shell: bash
        run: |
          set -euo pipefail

          language='${{ steps.detect.outputs.language }}'
          version_file='${{ steps.detect.outputs.version-file }}'
          new_version='${{ steps.version-calc.outputs.new-version }}'

          echo "Updating $language version file: $version_file"

          if [ "$language" = 'dotnet' ]; then
            # Update Directory.Build.props
            sed -i "s/<Version>[^<]*<\/Version>/<Version>${new_version}<\/Version>/g" "$version_file"
          elif [ "$language" = 'python' ]; then
            # Update pyproject.toml
            if grep -q 'version.*=' "$version_file"; then
              sed -i "s/version\s*=\s*[\"'][^\"']*[\"']/version = \"${new_version}\"/g" "$version_file"
            fi
          fi

          echo "✓ Version file updated to $new_version"

      - name: Create version bump PR
        shell: bash
        run: |
          set -euo pipefail

          new_version='${{ steps.version-calc.outputs.new-version }}'
          current_version='${{ steps.version-calc.outputs.current-version }}'
          bump_type='${{ steps.version-calc.outputs.bump-type }}'
          base_branch='${{ inputs.base-branch }}'

          # Create branch
          branch_name="chore/bump-version-to-${new_version}"
          git checkout -b "$branch_name" "origin/${base_branch}"

          # Commit changes
          git add .
          git commit -m "chore(release): bump version from ${current_version} to ${new_version}

          - Type: ${bump_type}
          - Updated by automated version-bump workflow
          - Triggered after merge of version-bump PR

          This commit will trigger release-tag workflow after merge."

          # Push branch
          git push origin "$branch_name"

          # Create PR
          gh pr create \
            --base "$base_branch" \
            --head "$branch_name" \
            --title "chore(release): bump version to ${new_version}" \
            --body "## Version Bump

          - **Current version**: ${current_version}
          - **New version**: ${new_version}
          - **Bump type**: ${bump_type}

          **Automated by**: version-bump workflow" \
            --label "release" || echo "PR creation failed or already exists"

        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
